name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Cache do Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Formatacao
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: tokens.css sincronizado com a fonte
        run: |
          pnpm --filter @fluxo/tokens build
          pnpm --filter @fluxo/tokens tokens:check

      - name: Tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Nenhum travessao no texto
        run: |
          # AGENTS.md regra 4: sem travessao na UI, na documentacao nem na saida
          # da IA. Arquivos de teste ficam de fora porque usam o caractere como
          # fixture, para provar que o schema o recusa.
          if git grep -nI -e $'—' -e $'–' -- '*.ts' '*.vue' '*.css' '*.md' \
               ':!AGENTS.md' ':!PROMPT-fluxo.md' ':!*.test.ts'; then
            echo "Travessao encontrado. Use virgula, dois pontos ou ponto final."
            exit 1
          fi

      - name: Nenhum segredo commitado
        run: |
          if git grep -nIE '(AIza[0-9A-Za-z_-]{35}|postgres(ql)?://[^ ]*:[^ ]*@)' -- . ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml'; then
            echo "Segredo aparente encontrado no versionamento. Ver AGENTS.md regra 6."
            exit 1
          fi
